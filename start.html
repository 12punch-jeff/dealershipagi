<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Find Your Car — DealershipAGI</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    
    <style>
        :root {
            --color-primary: #1A1A2E;
            --color-accent: #4F46E5;
            --color-accent-hover: #4338CA;
            --color-accent-light: #EEF2FF;
            --color-white: #FFFFFF;
            --color-gray-50: #F9FAFB;
            --color-gray-100: #F3F4F6;
            --color-gray-200: #E5E7EB;
            --color-gray-400: #9CA3AF;
            --color-gray-500: #6B7280;
            --color-gray-700: #374151;
            --color-gray-900: #111827;
            
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-full: 9999px;
            --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
            --duration-normal: 200ms;
            --ease-default: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-sans);
            font-size: 16px;
            line-height: 1.5;
            color: var(--color-gray-700);
            background: var(--color-gray-50);
            -webkit-font-smoothing: antialiased;
        }

        /* ===== Layout ===== */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 600px;
            margin: 0 auto;
            background: var(--color-white);
        }

        @media (min-width: 640px) {
            .chat-container {
                height: calc(100% - 48px);
                margin: 24px auto;
                border-radius: var(--radius-xl);
                box-shadow: var(--shadow-md);
                border: 1px solid var(--color-gray-100);
            }
        }

        /* ===== Header ===== */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--color-gray-100);
            background: var(--color-white);
        }

        @media (min-width: 640px) {
            .chat-header {
                border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            }
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            background: var(--color-accent);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .chat-title {
            font-weight: 600;
            font-size: 15px;
            color: var(--color-gray-900);
        }

        .chat-subtitle {
            font-size: 13px;
            color: var(--color-gray-400);
        }

        .chat-close {
            width: 36px;
            height: 36px;
            border: none;
            background: none;
            color: var(--color-gray-400);
            cursor: pointer;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--duration-normal);
        }

        .chat-close:hover {
            background: var(--color-gray-100);
            color: var(--color-gray-700);
        }

        /* ===== Progress ===== */
        .chat-progress {
            padding: 12px 20px;
            background: var(--color-gray-50);
            border-bottom: 1px solid var(--color-gray-100);
        }

        .progress-bar {
            height: 4px;
            background: var(--color-gray-200);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--color-accent);
            border-radius: var(--radius-full);
            transition: width 0.3s ease;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: var(--color-gray-400);
        }

        /* ===== Messages ===== */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: messageIn 0.3s ease;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-bot {
            align-self: flex-start;
        }

        .message-user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-full);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message-bot .message-avatar {
            background: var(--color-accent);
            color: white;
        }

        .message-user .message-avatar {
            background: var(--color-gray-200);
            color: var(--color-gray-500);
        }

        .message-content {
            padding: 12px 16px;
            border-radius: var(--radius-lg);
            font-size: 15px;
        }

        .message-bot .message-content {
            background: var(--color-gray-100);
            color: var(--color-gray-700);
            border-bottom-left-radius: 4px;
        }

        .message-user .message-content {
            background: var(--color-accent);
            color: white;
            border-bottom-right-radius: 4px;
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 16px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--color-gray-400);
            border-radius: var(--radius-full);
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        /* ===== Quick Replies ===== */
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 20px 16px;
        }

        .quick-reply {
            padding: 10px 16px;
            background: var(--color-white);
            border: 1px solid var(--color-gray-200);
            border-radius: var(--radius-full);
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            color: var(--color-gray-700);
            cursor: pointer;
            transition: all var(--duration-normal);
        }

        .quick-reply:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
            background: var(--color-accent-light);
        }

        .quick-reply:active {
            transform: scale(0.98);
        }

        /* ===== Input ===== */
        .chat-input {
            padding: 16px 20px;
            border-top: 1px solid var(--color-gray-100);
            background: var(--color-white);
        }

        @media (min-width: 640px) {
            .chat-input {
                border-radius: 0 0 var(--radius-xl) var(--radius-xl);
            }
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--color-gray-200);
            border-radius: var(--radius-lg);
            font-family: inherit;
            font-size: 15px;
            color: var(--color-gray-900);
            resize: none;
            min-height: 48px;
            max-height: 120px;
            transition: border-color var(--duration-normal);
        }

        .input-field:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        .input-field::placeholder {
            color: var(--color-gray-400);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            background: var(--color-accent);
            border: none;
            border-radius: var(--radius-lg);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--duration-normal);
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: var(--color-accent-hover);
        }

        .send-btn:disabled {
            background: var(--color-gray-200);
            cursor: not-allowed;
        }

        /* ===== Hidden ===== */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="chat-header-left">
                <div class="chat-avatar">
                    <i data-lucide="bot" style="width: 20px; height: 20px;"></i>
                </div>
                <div>
                    <div class="chat-title">Scout</div>
                    <div class="chat-subtitle">Your car-finding assistant</div>
                </div>
            </div>
            <button class="chat-close" onclick="window.location.href='/'">
                <i data-lucide="x" style="width: 20px; height: 20px;"></i>
            </button>
        </div>

        <!-- Progress -->
        <div class="chat-progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 10%"></div>
            </div>
            <div class="progress-text">
                <span id="progress-step">Getting started</span>
                <span id="progress-percent">10%</span>
            </div>
        </div>

        <!-- Messages -->
        <div class="chat-messages" id="messages">
            <!-- Messages inserted here -->
        </div>

        <!-- Quick Replies -->
        <div class="quick-replies" id="quick-replies">
            <!-- Quick reply buttons inserted here -->
        </div>

        <!-- Input -->
        <div class="chat-input">
            <div class="input-wrapper">
                <textarea 
                    class="input-field" 
                    id="user-input" 
                    placeholder="Type your answer..." 
                    rows="1"
                ></textarea>
                <button class="send-btn" id="send-btn">
                    <i data-lucide="send" style="width: 20px; height: 20px;"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // ===== Chat State =====
        const chatState = {
            step: 0,
            data: {},
            isTyping: false
        };

        // ===== Conversation Flow =====
        const conversation = [
            {
                id: 'welcome',
                message: "Hi! I'm Scout, your car-finding assistant. 👋\n\nI'll ask a few questions to understand what you're looking for. Takes about 3 minutes. Ready to find your perfect deal?",
                quickReplies: ["Let's do it!", "How does this work?"],
                progress: { step: "Getting started", percent: 10 }
            },
            {
                id: 'vehicle_type',
                message: "Great! First, what type of vehicle are you looking for?",
                quickReplies: ["Car / Sedan", "SUV / Crossover", "Truck", "Van / Minivan", "Not sure yet"],
                field: 'vehicle_type',
                progress: { step: "Vehicle type", percent: 20 }
            },
            {
                id: 'condition',
                message: "Are you open to used vehicles, or looking strictly new?",
                quickReplies: ["New only", "Used is fine", "Certified Pre-Owned", "No preference"],
                field: 'condition',
                progress: { step: "New or used", percent: 30 }
            },
            {
                id: 'budget_type',
                message: "How are you planning to pay?",
                quickReplies: ["Monthly payments", "Cash / Full price"],
                field: 'budget_type',
                progress: { step: "Budget", percent: 40 }
            },
            {
                id: 'budget_monthly',
                message: "What monthly payment range works for you?",
                quickReplies: ["Under $300", "$300 - $500", "$500 - $700", "$700+"],
                field: 'budget_amount',
                condition: (data) => data.budget_type === 'Monthly payments',
                progress: { step: "Budget", percent: 50 }
            },
            {
                id: 'budget_cash',
                message: "What's your target purchase price?",
                quickReplies: ["Under $20,000", "$20,000 - $35,000", "$35,000 - $50,000", "$50,000+"],
                field: 'budget_amount',
                condition: (data) => data.budget_type === 'Cash / Full price',
                progress: { step: "Budget", percent: 50 }
            },
            {
                id: 'features',
                message: "Any must-have features? Select all that apply, or type your own.",
                quickReplies: ["AWD / 4WD", "Third row seating", "Great fuel economy", "Towing capacity", "Luxury features", "Advanced safety tech", "None specifically"],
                field: 'features',
                multiSelect: true,
                progress: { step: "Features", percent: 60 }
            },
            {
                id: 'timeline',
                message: "When do you need the vehicle?",
                quickReplies: ["ASAP", "Within 2 weeks", "Within a month", "Just researching"],
                field: 'timeline',
                progress: { step: "Timeline", percent: 70 }
            },
            {
                id: 'location',
                message: "What's your zip code? We'll find dealers within driving distance.",
                inputOnly: true,
                field: 'zip_code',
                validate: (value) => /^\d{5}$/.test(value),
                errorMessage: "Please enter a valid 5-digit zip code.",
                progress: { step: "Location", percent: 80 }
            },
            {
                id: 'trade_in',
                message: "Do you have a vehicle to trade in?",
                quickReplies: ["Yes", "No", "Maybe, depends on the offer"],
                field: 'trade_in',
                progress: { step: "Trade-in", percent: 85 }
            },
            {
                id: 'email',
                message: "Almost done! Where should we send your offers?\n\nEnter your email address:",
                inputOnly: true,
                field: 'email',
                validate: (value) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value),
                errorMessage: "Please enter a valid email address.",
                progress: { step: "Contact info", percent: 95 }
            },
            {
                id: 'complete',
                message: "Perfect! 🎉\n\nWe've got everything we need. Our team will start searching for your best deals right away.\n\nExpect to hear from us within 24 hours at {email}.\n\nIn the meantime, we'll send you a confirmation email with a link to check your status.",
                isEnd: true,
                progress: { step: "Complete!", percent: 100 }
            }
        ];

        // ===== DOM Elements =====
        const messagesEl = document.getElementById('messages');
        const quickRepliesEl = document.getElementById('quick-replies');
        const userInputEl = document.getElementById('user-input');
        const sendBtnEl = document.getElementById('send-btn');
        const progressFillEl = document.getElementById('progress-fill');
        const progressStepEl = document.getElementById('progress-step');
        const progressPercentEl = document.getElementById('progress-percent');

        // ===== Functions =====
        function getNextStep() {
            for (let i = chatState.step; i < conversation.length; i++) {
                const step = conversation[i];
                if (step.condition && !step.condition(chatState.data)) {
                    continue;
                }
                return i;
            }
            return conversation.length - 1;
        }

        function updateProgress(progress) {
            progressFillEl.style.width = progress.percent + '%';
            progressStepEl.textContent = progress.step;
            progressPercentEl.textContent = progress.percent + '%';
        }

        function addMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'message-user' : 'message-bot'}`;
            
            // Replace {field} placeholders
            let processedContent = content;
            Object.keys(chatState.data).forEach(key => {
                processedContent = processedContent.replace(`{${key}}`, chatState.data[key]);
            });
            
            messageDiv.innerHTML = `
                <div class="message-avatar">
                    <i data-lucide="${isUser ? 'user' : 'bot'}" style="width: 16px; height: 16px;"></i>
                </div>
                <div class="message-content">${processedContent.replace(/\n/g, '<br>')}</div>
            `;
            
            messagesEl.appendChild(messageDiv);
            lucide.createIcons();
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function showTyping() {
            chatState.isTyping = true;
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message message-bot';
            typingDiv.id = 'typing';
            typingDiv.innerHTML = `
                <div class="message-avatar">
                    <i data-lucide="bot" style="width: 16px; height: 16px;"></i>
                </div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            messagesEl.appendChild(typingDiv);
            lucide.createIcons();
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function hideTyping() {
            chatState.isTyping = false;
            const typingEl = document.getElementById('typing');
            if (typingEl) typingEl.remove();
        }

        function showQuickReplies(replies) {
            quickRepliesEl.innerHTML = '';
            if (!replies || replies.length === 0) {
                quickRepliesEl.classList.add('hidden');
                return;
            }
            
            quickRepliesEl.classList.remove('hidden');
            replies.forEach(reply => {
                const btn = document.createElement('button');
                btn.className = 'quick-reply';
                btn.textContent = reply;
                btn.onclick = () => handleUserInput(reply);
                quickRepliesEl.appendChild(btn);
            });
        }

        function processStep() {
            const stepIndex = getNextStep();
            const step = conversation[stepIndex];
            chatState.step = stepIndex + 1;
            
            updateProgress(step.progress);
            
            showTyping();
            
            setTimeout(() => {
                hideTyping();
                addMessage(step.message);
                
                if (step.isEnd) {
                    quickRepliesEl.classList.add('hidden');
                    userInputEl.disabled = true;
                    sendBtnEl.disabled = true;
                    userInputEl.placeholder = "Chat complete";
                    
                    // In production, would submit data here
                    console.log('Chat complete. Data:', chatState.data);
                } else if (step.inputOnly) {
                    showQuickReplies([]);
                    userInputEl.focus();
                } else {
                    showQuickReplies(step.quickReplies);
                }
            }, 800 + Math.random() * 400);
        }

        function handleUserInput(input) {
            if (chatState.isTyping) return;
            
            const stepIndex = chatState.step - 1;
            const currentStep = conversation[stepIndex];
            
            // Validate if needed
            if (currentStep.validate && !currentStep.validate(input)) {
                addMessage(input, true);
                setTimeout(() => {
                    addMessage(currentStep.errorMessage);
                }, 500);
                return;
            }
            
            // Handle special case: "How does this work?"
            if (input === "How does this work?") {
                addMessage(input, true);
                showTyping();
                setTimeout(() => {
                    hideTyping();
                    addMessage("Here's how it works:\n\n1️⃣ You tell me what car you're looking for\n2️⃣ We contact dealers and negotiate on your behalf\n3️⃣ You pick the best deal — only then do we share your info\n\nYour privacy is protected until you choose. Ready?");
                    showQuickReplies(["Let's do it!"]);
                }, 1000);
                return;
            }
            
            // Save data
            if (currentStep.field) {
                chatState.data[currentStep.field] = input;
            }
            
            // Show user message
            addMessage(input, true);
            
            // Clear input
            userInputEl.value = '';
            quickRepliesEl.classList.add('hidden');
            
            // Process next step
            setTimeout(processStep, 300);
        }

        // ===== Event Listeners =====
        sendBtnEl.onclick = () => {
            const input = userInputEl.value.trim();
            if (input) handleUserInput(input);
        };

        userInputEl.onkeypress = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const input = userInputEl.value.trim();
                if (input) handleUserInput(input);
            }
        };

        // Auto-resize textarea
        userInputEl.oninput = () => {
            userInputEl.style.height = 'auto';
            userInputEl.style.height = Math.min(userInputEl.scrollHeight, 120) + 'px';
        };

        // ===== Initialize =====
        processStep();
    </script>
</body>
</html>
