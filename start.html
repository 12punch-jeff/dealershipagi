<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Find Your Car — DealershipAGI</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    
    <style>
        :root {
            /* Agi Emerald Brand Colors */
            --color-primary: #064E3B;
            --color-primary-light: #065F46;
            --color-accent: #10B981;
            --color-accent-hover: #059669;
            --color-accent-light: #D1FAE5;
            --color-white: #FFFFFF;
            --color-gray-50: #F9FAFB;
            --color-gray-100: #F3F4F6;
            --color-gray-200: #E5E7EB;
            --color-gray-400: #9CA3AF;
            --color-gray-500: #6B7280;
            --color-gray-700: #374151;
            --color-gray-900: #111827;
            
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-full: 9999px;
            --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
            --duration-normal: 200ms;
            --ease-default: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: var(--font-sans);
            font-size: 16px;
            line-height: 1.5;
            color: var(--color-gray-700);
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
            -webkit-font-smoothing: antialiased;
        }

        /* ===== Layout ===== */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: var(--color-white);
        }

        @media (min-width: 640px) {
            .chat-container {
                height: calc(100% - 48px);
                margin: 24px auto;
                border-radius: var(--radius-xl);
                box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            }
        }

        /* ===== Header ===== */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--color-gray-100);
            background: var(--color-white);
        }

        @media (min-width: 640px) {
            .chat-header {
                border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            }
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-avatar {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            overflow: hidden;
        }
        
        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-title {
            font-weight: 600;
            font-size: 16px;
            color: var(--color-gray-900);
        }

        .chat-subtitle {
            font-size: 13px;
            color: var(--color-accent);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background: var(--color-accent);
            border-radius: var(--radius-full);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-close {
            width: 36px;
            height: 36px;
            border: none;
            background: none;
            color: var(--color-gray-400);
            cursor: pointer;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--duration-normal);
        }

        .chat-close:hover {
            background: var(--color-gray-100);
            color: var(--color-gray-700);
        }

        /* ===== Progress ===== */
        .chat-progress {
            padding: 12px 20px;
            background: var(--color-gray-50);
            border-bottom: 1px solid var(--color-gray-100);
        }

        .progress-bar {
            height: 4px;
            background: var(--color-gray-200);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--color-primary) 0%, var(--color-accent) 100%);
            border-radius: var(--radius-full);
            transition: width 0.5s ease;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: var(--color-gray-400);
        }

        /* ===== Messages ===== */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 10px;
            max-width: 88%;
            animation: messageIn 0.3s ease;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-bot {
            align-self: flex-start;
        }

        .message-user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-md);
            flex-shrink: 0;
            overflow: hidden;
        }
        
        .message-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message-user .message-avatar {
            background: var(--color-gray-200);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-gray-500);
        }

        .message-content {
            padding: 12px 16px;
            border-radius: var(--radius-lg);
            font-size: 15px;
            line-height: 1.5;
        }

        .message-bot .message-content {
            background: var(--color-gray-100);
            color: var(--color-gray-700);
            border-bottom-left-radius: 4px;
        }

        .message-user .message-content {
            background: var(--color-accent);
            color: white;
            border-bottom-right-radius: 4px;
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--color-gray-400);
            border-radius: var(--radius-full);
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        /* ===== Quick Replies ===== */
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 20px 16px;
        }

        .quick-reply {
            padding: 10px 16px;
            background: var(--color-white);
            border: 2px solid var(--color-gray-200);
            border-radius: var(--radius-full);
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            color: var(--color-gray-700);
            cursor: pointer;
            transition: all var(--duration-normal);
        }

        .quick-reply:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
            background: var(--color-accent-light);
        }

        .quick-reply:active {
            transform: scale(0.98);
        }
        
        .quick-reply.selected {
            border-color: var(--color-accent);
            background: var(--color-accent);
            color: white;
        }

        /* ===== Input ===== */
        .chat-input {
            padding: 16px 20px;
            border-top: 1px solid var(--color-gray-100);
            background: var(--color-white);
        }

        @media (min-width: 640px) {
            .chat-input {
                border-radius: 0 0 var(--radius-xl) var(--radius-xl);
            }
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--color-gray-200);
            border-radius: var(--radius-lg);
            font-family: inherit;
            font-size: 15px;
            color: var(--color-gray-900);
            resize: none;
            min-height: 48px;
            max-height: 120px;
            transition: border-color var(--duration-normal);
        }

        .input-field:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        .input-field::placeholder {
            color: var(--color-gray-400);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            background: var(--color-accent);
            border: none;
            border-radius: var(--radius-lg);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--duration-normal);
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: var(--color-accent-hover);
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: var(--color-gray-200);
            cursor: not-allowed;
            transform: none;
        }

        /* ===== Hidden ===== */
        .hidden {
            display: none !important;
        }
        
        /* ===== Success State ===== */
        .success-container {
            text-align: center;
            padding: 40px 20px;
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            background: var(--color-accent-light);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: var(--color-accent);
        }
        
        .success-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--color-gray-900);
            margin-bottom: 8px;
        }
        
        .success-text {
            color: var(--color-gray-500);
            margin-bottom: 24px;
        }
        
        .success-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: var(--color-accent);
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--duration-normal);
        }
        
        .success-btn:hover {
            background: var(--color-accent-hover);
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="chat-header-left">
                <div class="chat-avatar">
                    <img src="logo-agi-dogcar-v1.jpg" alt="Agi">
                </div>
                <div>
                    <div class="chat-title">Agi</div>
                    <div class="chat-subtitle">
                        <span class="online-dot"></span>
                        Online now
                    </div>
                </div>
            </div>
            <button class="chat-close" onclick="window.location.href='/'">
                <i data-lucide="x" style="width: 20px; height: 20px;"></i>
            </button>
        </div>

        <!-- Progress -->
        <div class="chat-progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 5%"></div>
            </div>
            <div class="progress-text">
                <span id="progress-step">Let's find your car</span>
                <span id="progress-percent">5%</span>
            </div>
        </div>

        <!-- Messages -->
        <div class="chat-messages" id="messages">
            <!-- Messages inserted here -->
        </div>

        <!-- Quick Replies -->
        <div class="quick-replies" id="quick-replies">
            <!-- Quick reply buttons inserted here -->
        </div>

        <!-- Input -->
        <div class="chat-input" id="chat-input">
            <div class="input-wrapper">
                <textarea 
                    class="input-field" 
                    id="user-input" 
                    placeholder="Type your answer..." 
                    rows="1"
                ></textarea>
                <button class="send-btn" id="send-btn">
                    <i data-lucide="send" style="width: 20px; height: 20px;"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // ===== Chat State =====
        const chatState = {
            step: 0,
            data: {},
            isTyping: false,
            selectedFeatures: []
        };

        // ===== Conversation Flow =====
        const conversation = [
            {
                id: 'welcome',
                message: "Hey there! I'm Agi 🐕\n\nI help people find great deals on cars without the dealership headaches. Tell me what you're looking for, and I'll fetch the best options.\n\nReady to get started?",
                quickReplies: ["Let's do it!", "How does this work?"],
                progress: { step: "Let's find your car", percent: 5 }
            },
            {
                id: 'vehicle_type',
                message: "Awesome! What type of vehicle are you looking for?",
                quickReplies: ["🚗 Car / Sedan", "🚙 SUV / Crossover", "🛻 Truck", "🚐 Van / Minivan", "🤷 Not sure yet"],
                field: 'vehicle_type',
                progress: { step: "Vehicle type", percent: 15 }
            },
            {
                id: 'specific_model',
                message: "Do you have a specific make or model in mind? Or are you open to suggestions?",
                quickReplies: ["I know what I want", "Open to suggestions", "I have a few in mind"],
                field: 'model_preference',
                progress: { step: "Vehicle details", percent: 22 }
            },
            {
                id: 'specific_model_input',
                message: "Great! What make/model are you looking for? (e.g., Honda Accord, Toyota RAV4)",
                inputOnly: true,
                field: 'target_vehicle',
                condition: (data) => data.model_preference === 'I know what I want' || data.model_preference === 'I have a few in mind',
                progress: { step: "Vehicle details", percent: 28 }
            },
            {
                id: 'condition',
                message: "Are you looking for new or used?",
                quickReplies: ["New only", "Used is great", "Certified Pre-Owned", "Either works"],
                field: 'condition',
                progress: { step: "New or used", percent: 35 }
            },
            {
                id: 'budget_type',
                message: "How are you planning to pay for it?",
                quickReplies: ["💳 Financing / Monthly", "💵 Cash / Full price", "Not sure yet"],
                field: 'budget_type',
                progress: { step: "Budget", percent: 42 }
            },
            {
                id: 'budget_monthly',
                message: "What monthly payment range works for your budget?",
                quickReplies: ["Under $300/mo", "$300 - $500/mo", "$500 - $700/mo", "$700 - $1000/mo", "$1000+/mo"],
                field: 'budget_amount',
                condition: (data) => data.budget_type === '💳 Financing / Monthly',
                progress: { step: "Budget", percent: 50 }
            },
            {
                id: 'budget_cash',
                message: "What's your target price range?",
                quickReplies: ["Under $20k", "$20k - $35k", "$35k - $50k", "$50k - $75k", "$75k+"],
                field: 'budget_amount',
                condition: (data) => data.budget_type === '💵 Cash / Full price' || data.budget_type === 'Not sure yet',
                progress: { step: "Budget", percent: 50 }
            },
            {
                id: 'features',
                message: "Any must-have features? Tap all that apply:",
                quickReplies: ["AWD / 4WD", "Leather seats", "Sunroof", "3rd row seating", "Apple CarPlay", "Good MPG", "Towing", "Safety tech", "None specific"],
                field: 'features',
                multiSelect: true,
                progress: { step: "Features", percent: 58 }
            },
            {
                id: 'dealbreakers',
                message: "Anything that's a dealbreaker? Things you definitely DON'T want?",
                quickReplies: ["High mileage", "Certain colors", "Rebuilt title", "No specific dealbreakers"],
                field: 'dealbreakers',
                progress: { step: "Preferences", percent: 65 }
            },
            {
                id: 'timeline',
                message: "When do you need the vehicle by?",
                quickReplies: ["ASAP - this week", "Within 2 weeks", "Within a month", "No rush, just looking"],
                field: 'timeline',
                progress: { step: "Timeline", percent: 72 }
            },
            {
                id: 'trade_in',
                message: "Do you have a vehicle to trade in?",
                quickReplies: ["Yes, I have a trade-in", "No trade-in", "Maybe, depends on the deal"],
                field: 'trade_in',
                progress: { step: "Trade-in", percent: 78 }
            },
            {
                id: 'trade_in_details',
                message: "What vehicle are you trading? (Year, Make, Model, rough mileage)",
                inputOnly: true,
                field: 'trade_in_vehicle',
                condition: (data) => data.trade_in === 'Yes, I have a trade-in',
                progress: { step: "Trade-in details", percent: 82 }
            },
            {
                id: 'location',
                message: "What's your zip code? I'll find dealers within a reasonable drive.",
                inputOnly: true,
                field: 'zip_code',
                validate: (value) => /^\d{5}$/.test(value),
                errorMessage: "Oops! Please enter a valid 5-digit zip code.",
                progress: { step: "Location", percent: 86 }
            },
            {
                id: 'name',
                message: "Almost done! What's your first name?",
                inputOnly: true,
                field: 'first_name',
                progress: { step: "Contact info", percent: 90 }
            },
            {
                id: 'email',
                message: "And what's the best email to reach you at?",
                inputOnly: true,
                field: 'email',
                validate: (value) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value),
                errorMessage: "That doesn't look like a valid email. Try again?",
                progress: { step: "Contact info", percent: 94 }
            },
            {
                id: 'phone',
                message: "Last one — what's your phone number? (We'll only text you about your deals)",
                inputOnly: true,
                field: 'phone',
                validate: (value) => /^[\d\s\-\(\)\.+]{10,}$/.test(value.replace(/\D/g, '')) && value.replace(/\D/g, '').length >= 10,
                errorMessage: "Please enter a valid phone number.",
                progress: { step: "Contact info", percent: 98 }
            },
            {
                id: 'complete',
                message: "Perfect, {first_name}! 🎉\n\nI've got everything I need. I'm going to start sniffing out the best deals for you right now.\n\nExpect to hear from me within 24 hours with some great options. I'll send updates to {email}.\n\nTalk soon!",
                isEnd: true,
                progress: { step: "Complete!", percent: 100 }
            }
        ];

        // ===== DOM Elements =====
        const messagesEl = document.getElementById('messages');
        const quickRepliesEl = document.getElementById('quick-replies');
        const userInputEl = document.getElementById('user-input');
        const sendBtnEl = document.getElementById('send-btn');
        const progressFillEl = document.getElementById('progress-fill');
        const progressStepEl = document.getElementById('progress-step');
        const progressPercentEl = document.getElementById('progress-percent');

        // ===== Functions =====
        function getNextStep() {
            for (let i = chatState.step; i < conversation.length; i++) {
                const step = conversation[i];
                if (step.condition && !step.condition(chatState.data)) {
                    continue;
                }
                return i;
            }
            return conversation.length - 1;
        }

        function updateProgress(progress) {
            progressFillEl.style.width = progress.percent + '%';
            progressStepEl.textContent = progress.step;
            progressPercentEl.textContent = progress.percent + '%';
        }

        function addMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'message-user' : 'message-bot'}`;
            
            // Replace {field} placeholders
            let processedContent = content;
            Object.keys(chatState.data).forEach(key => {
                processedContent = processedContent.replace(new RegExp(`{${key}}`, 'g'), chatState.data[key]);
            });
            
            const avatarContent = isUser 
                ? '<i data-lucide="user" style="width: 16px; height: 16px;"></i>'
                : '<img src="logo-agi-dogcar-v1.jpg" alt="Agi">';
            
            messageDiv.innerHTML = `
                <div class="message-avatar">${avatarContent}</div>
                <div class="message-content">${processedContent.replace(/\n/g, '<br>')}</div>
            `;
            
            messagesEl.appendChild(messageDiv);
            lucide.createIcons();
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function showTyping() {
            chatState.isTyping = true;
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message message-bot';
            typingDiv.id = 'typing';
            typingDiv.innerHTML = `
                <div class="message-avatar"><img src="logo-agi-dogcar-v1.jpg" alt="Agi"></div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            messagesEl.appendChild(typingDiv);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function hideTyping() {
            chatState.isTyping = false;
            const typingEl = document.getElementById('typing');
            if (typingEl) typingEl.remove();
        }

        function showQuickReplies(replies, multiSelect = false) {
            quickRepliesEl.innerHTML = '';
            chatState.selectedFeatures = [];
            
            if (!replies || replies.length === 0) {
                quickRepliesEl.classList.add('hidden');
                return;
            }
            
            quickRepliesEl.classList.remove('hidden');
            
            replies.forEach(reply => {
                const btn = document.createElement('button');
                btn.className = 'quick-reply';
                btn.textContent = reply;
                
                if (multiSelect) {
                    btn.onclick = () => {
                        if (reply === 'None specific') {
                            handleUserInput('None specific');
                            return;
                        }
                        btn.classList.toggle('selected');
                        if (btn.classList.contains('selected')) {
                            chatState.selectedFeatures.push(reply);
                        } else {
                            chatState.selectedFeatures = chatState.selectedFeatures.filter(f => f !== reply);
                        }
                    };
                } else {
                    btn.onclick = () => handleUserInput(reply);
                }
                
                quickRepliesEl.appendChild(btn);
            });
            
            if (multiSelect) {
                const doneBtn = document.createElement('button');
                doneBtn.className = 'quick-reply';
                doneBtn.textContent = '✓ Done';
                doneBtn.style.background = 'var(--color-accent)';
                doneBtn.style.color = 'white';
                doneBtn.style.borderColor = 'var(--color-accent)';
                doneBtn.onclick = () => {
                    const selected = chatState.selectedFeatures.length > 0 
                        ? chatState.selectedFeatures.join(', ') 
                        : 'None specific';
                    handleUserInput(selected);
                };
                quickRepliesEl.appendChild(doneBtn);
            }
        }

        function processStep() {
            const stepIndex = getNextStep();
            const step = conversation[stepIndex];
            chatState.step = stepIndex + 1;
            
            updateProgress(step.progress);
            
            showTyping();
            
            const delay = 600 + Math.random() * 400;
            
            setTimeout(() => {
                hideTyping();
                addMessage(step.message);
                
                if (step.isEnd) {
                    quickRepliesEl.classList.add('hidden');
                    userInputEl.disabled = true;
                    sendBtnEl.disabled = true;
                    userInputEl.placeholder = "Chat complete";
                    
                    // Submit data to backend
                    submitLead(chatState.data);
                    
                } else if (step.inputOnly) {
                    showQuickReplies([]);
                    userInputEl.focus();
                } else {
                    showQuickReplies(step.quickReplies, step.multiSelect);
                }
            }, delay);
        }

        function handleUserInput(input) {
            if (chatState.isTyping) return;
            
            const stepIndex = chatState.step - 1;
            const currentStep = conversation[stepIndex];
            
            // Validate if needed
            if (currentStep.validate && !currentStep.validate(input)) {
                addMessage(input, true);
                setTimeout(() => {
                    addMessage(currentStep.errorMessage);
                }, 500);
                return;
            }
            
            // Handle special case: "How does this work?"
            if (input === "How does this work?") {
                addMessage(input, true);
                showTyping();
                setTimeout(() => {
                    hideTyping();
                    addMessage("Here's how it works:\n\n🔍 You tell me what car you want\n🏷️ I search inventory & contact dealers for you\n💰 I negotiate to get you the best price\n🤝 You only connect with the dealer when you're ready\n\nYour info stays private until YOU decide to share it. Ready to find your car?");
                    showQuickReplies(["Let's do it!"]);
                }, 1000);
                return;
            }
            
            // Save data
            if (currentStep.field) {
                chatState.data[currentStep.field] = input;
            }
            
            // Show user message
            addMessage(input, true);
            
            // Clear input
            userInputEl.value = '';
            quickRepliesEl.classList.add('hidden');
            
            // Process next step
            setTimeout(processStep, 300);
        }
        
        function submitLead(data) {
            // Log for now - will connect to backend
            console.log('Lead submitted:', data);
            
            // Store in localStorage for demo
            const leads = JSON.parse(localStorage.getItem('agi_leads') || '[]');
            leads.push({
                ...data,
                submitted_at: new Date().toISOString(),
                status: 'new'
            });
            localStorage.setItem('agi_leads', JSON.stringify(leads));
            
            // In production, POST to your backend:
            // fetch('/api/leads', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify(data)
            // });
        }

        // ===== Event Listeners =====
        sendBtnEl.onclick = () => {
            const input = userInputEl.value.trim();
            if (input) handleUserInput(input);
        };

        userInputEl.onkeypress = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const input = userInputEl.value.trim();
                if (input) handleUserInput(input);
            }
        };

        // Auto-resize textarea
        userInputEl.oninput = () => {
            userInputEl.style.height = 'auto';
            userInputEl.style.height = Math.min(userInputEl.scrollHeight, 120) + 'px';
        };

        // ===== Initialize =====
        processStep();
    </script>
</body>
</html>
